<html>

<head>
   <title>Addmission form </title>
</head>

<body>
   <h1>Admission Form</h1>
   <form action="">
      <fieldset>
         <legend>Admission Form</legend>
         <label for="first-name">First Name :</label> <input placeholder="Enter your first-name" type="text"
            name="first-name" />
         <br />
         <br />
         <label for="middle-name">Middle Name :</label> <input placeholder="Enter your middle-name" type="text"
            name="middle-name" />
         <br />
         <br />
         <label for="last-name">Last Name :</label> <input placeholder="Enter your last-name" type="text"
            name="last-name" />
         <br />
         <br />
         <label for="mobile-number">Mobile Number :</label> <input placeholder="Enter mobile-number" type="number"
            name="mobile-number">
         <br />
         <br />
         <label for="email">Email :</label> <input placeholder="Enter your email" type="email" name="email" />
         <br />
         <br />
         <label for="password">Password :</label> <input placeholder="Enter your password" type="password"
            name="password" />
         <br />
         <br />
         <label for="adhar">Adhar Number :</label> <input placeholder="Enter adhar-number" type="number"
            name="adhar" />
         <br />
         <br />
         <label for="age">Age :</label> <input placeholder="Enter your age " type="number" name="age" />
         <br />
         <br />
         <label for="dob">DOB :</label> <input type="datetime-local" name="dob" />
         <br />
         <br />
         <label for="address">Address :</label>  <textarea name="address" id="" placeholder="Enter your address" ></textarea>

         <label for="pincode">Pincode :</label> <input placeholder="Enter your pincode " type="number" name="pincode">
         <br />
         <br />
         <label for="gender">Gender :</label> <input type="radio" name="gender" />Male <input type="radio"
            name="gender" />Female
         <br />
         <br />
         <label for="course">Course :</label>
         <select name="course">
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="Java Script">Java Script</option>
         </select>
         <br />
         <br />
         <label for="hobbies">Hobbies :</label> <input type="checkbox" name="hobbies" />Playing
         <input type="checkbox" name="hobbies" />Singing
         <input type="checkbox" name="hobbies" />Dancing
         <br />
         <br />
         <label for=" photo">Passport Photo :</label> <input type="file" name="photo" />
         <br />
         <br />
         <label for="color">Favorite Color :</label>
         <input type="color" name="color">
         <br />
         <br />
         <label for="range">Communication Skill :</label> <input type="range" min="0" max="10">
         <br />
         <br />
         <label>Reset :</label> <input type="Reset" name="reset" />
         <label>Submit :</label> 
         <button>Submit</button>
      </fieldset>
   </form>
<br/>
<br/>
<br/>
